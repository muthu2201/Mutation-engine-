# Colloid CI: the portable engine on Linux, macOS and Windows.
#
# What runs where:
# - every OS: lint (ruff), strict types on the pure core and ports (mypy), the architecture
#   contracts (import-linter), and the portable test subset: core (search, stats, genome,
#   lake chain), the lake stores (directory + git branch), lake ingest/seed/warm start,
#   telemetry, the program store, and the portable platform layer (process sandbox,
#   psutil CPU accounting, PSS/USS, CPU pinning fallbacks).
# - ubuntu: additionally the whole non-integration suite.
# - not in CI: the root integration suite (Linux sandbox, Postgres, load generator, full
#   evaluator), which needs a privileged Linux host. Run it with
#   `sudo COLLOID_INTEGRATION=1 pytest tests` on a bench host or in the Colloid container (docker/).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: portable (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Toolchain (clang is used to build the C side of the Stack Atlas)
        run: clang --version
      - name: Lint
        run: ruff check .
      - name: Types (strict on core + ports)
        run: mypy
      - name: Architecture contracts
        run: lint-imports
      - name: Portable tests
        run: >-
          python -m pytest -q tests/core tests/portable tests/adapters/test_lake_store.py
          tests/adapters/test_lake_ingest.py tests/adapters/test_telemetry.py tests/adapters/test_store_conformance.py
      - name: Full non-integration suite (Linux)
        if: runner.os == 'Linux'
        run: python -m pytest -q tests

  linux-sandbox-cgroup-v2:
    # GitHub's Ubuntu runners use the unified cgroup v2 hierarchy (like Ubuntu 22.04+, Fedora,
    # Debian 12 and Docker Desktop's VM), and allow root: this job verifies the Linux sandbox's
    # v2 path for real (seccomp + namespaces + v2 cgroups), plus the portable CPU accounting
    # against v2 ground truth and the concurrent adversarial stress harness.
    name: linux sandbox (cgroup v2, root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: cgroup hierarchy
        run: |
          stat -fc %T /sys/fs/cgroup
          cat /sys/fs/cgroup/cgroup.controllers
      - name: Sandbox conformance + portable ground truth (root)
        run: sudo -E env "PATH=$PATH" COLLOID_INTEGRATION=1 python -m pytest -q tests/conformance/test_sandbox.py tests/portable
      - name: Concurrent adversarial sandbox stress (root)
        run: |
          sudo -E env "PATH=$PATH" python stress/stress_sandbox.py
          sudo cat /opt/colloid/state/stress_sandbox.json
